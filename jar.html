    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }
        body{
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
        }
        section{
            
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            gap: 2px;
            flex-wrap: wrap;
            
        }
        section::before{
            content: ' ';
            position: absolute;
            height: 100%;
            width: 100%;
            background: linear-gradient(#000,#0f0,#000);
            animation: animate 5s linear infinite;
            
        }
        @keyframes animate{
            0%{transform: translateY(-100%);}
            100%{transform: translateY(100%);}
        }
       section span{
    position: relative;
    display: block;
    width: calc(6.25vw - 2px);
    height: calc(6.25vw - 2px);
    background-color: #161616;
    z-index: 2;
    transition: 1.5s;
}

section span:hover{
    background-color: #0f0;
    transition: 0s;
}
    </style>
